{% extends "registration/base.html" %}

{% block title %}Verification Successful{% endblock %}

{% block content %}
<div class="professional-card p-10 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-50 text-emerald-600 mb-6 border border-emerald-100">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>
    
    <h1 class="text-2xl font-bold text-slate-800 mb-3 tracking-tight">Verified & Activated</h1>
    
    <p class="text-slate-600 text-base mb-1">
        The profile for <strong class="text-slate-900">{{ company.name }}</strong> is officially verified.
    </p>
    <p class="text-slate-500 text-sm mb-8">
        Your activation token has been processed securely.
    </p>

    <a href="#" class="inline-block bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-8 rounded-lg transition-colors">
        Proceed to Dashboard
    </a>
</div>
{% endblock %}
